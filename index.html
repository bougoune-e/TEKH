  <style>
    /* ================================================
       SPLASH SCREEN — Lottie Grid Premium
    ================================================ */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      z-index: 9999;
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), filter 0.7s ease;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Glow vert ambiant — plus discret sur fond clair */
    #splash-screen::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 520px;
      height: 520px;
      transform: translate(-50%, -55%);
      background: radial-gradient(circle, rgba(0, 180, 60, 0.06) 0%, transparent 68%);
      animation: splashGlowPulse 3s ease-in-out infinite;
      pointer-events: none;
    }

    /* Dot texture subtile en gris clair */
    #splash-screen::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    /* ── Lottie 2×2 grid ── */
    .splash-grid {
      display: grid;
      grid-template-columns: repeat(2, 100px);
      grid-template-rows: repeat(2, 100px);
      gap: 12px;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }

    .splash-cell {
      width: 100px;
      height: 100px;
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.6) translateY(10px);
      transition: opacity 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
        transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.4s ease;
      box-shadow: 0 0 0 0 rgba(0, 180, 60, 0);
    }

    /* Cells reveal — staggered via JS (class added) */
    .splash-cell.shown {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* Glows par cellule — adaptés fond clair */
    .splash-cell.shown:nth-child(1) {
      box-shadow: 0 4px 20px rgba(0, 180, 255, 0.15);
    }

    .splash-cell.shown:nth-child(2) {
      box-shadow: 0 4px 20px rgba(120, 80, 255, 0.15);
    }

    .splash-cell.shown:nth-child(3) {
      box-shadow: 0 4px 20px rgba(0, 180, 60, 0.15);
    }

    .splash-cell.shown:nth-child(4) {
      box-shadow: 0 4px 20px rgba(255, 140, 0, 0.15);
    }

    /* Each lottie container fills the cell */
    .splash-cell>div {
      width: 80px;
      height: 80px;
    }

    /* ── Brand block below grid ── */
    .splash-brand-block {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(12px);
      animation: splashBrandIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards;
    }

    .splash-logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .splash-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 0 0 1px rgba(0, 255, 65, 0.2), 0 0 20px rgba(0, 255, 65, 0.08);
    }

    .splash-brand-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: #111111;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .splash-brand-name .brand-plus {
      color: #059669;
      text-shadow: 0 0 16px rgba(5, 150, 105, 0.25);
    }

    .splash-tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.4);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* Slogan deux lignes */
    .splash-slogan {
      text-align: center;
      margin-top: 4px;
    }

    .splash-slogan-line {
      display: block;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.45);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.7;
      opacity: 0;
      transform: translateY(8px);
    }

    .splash-slogan-line.s1 {
      animation: splashBrandIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.7s forwards;
    }

    .splash-slogan-line.s2 {
      animation: splashBrandIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.9s forwards;
    }

    .splash-slogan-line .hl {
      color: #059669;
      font-weight: 800;
    }

    /* Progress bar */
    .splash-bar-wrap {
      position: absolute;
      bottom: 9%;
      left: 50%;
      transform: translateX(-50%);
      width: 48px;
      height: 2px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 2px;
      overflow: hidden;
      z-index: 1;
      animation: splashBarAppear 0.3s ease 0.5s both;
    }

    .splash-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #064e3b, #00FF41);
      border-radius: 2px;
      animation: splashBarFill 2.9s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
    }

    /* ── Exit ── */
    .splash-hidden {
      opacity: 0 !important;
      filter: blur(14px);
      pointer-events: none;
    }

    /* ── Keyframes ── */
    @keyframes splashGlowPulse {

      0%,
      100% {
        opacity: 0.7;
        transform: translate(-50%, -55%) scale(1);
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -55%) scale(1.08);
      }
    }

    @keyframes splashBrandIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes splashBarAppear {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes splashBarFill {
      from {
        width: 0%;
      }

      to {
        width: 100%;
      }
    }
  </style>
</head>

  <script type="module" src="/src/main.tsx"></script>
  <script>
    window.hideSplashScreen = () => {
      const splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('splash-hidden')) {
        splash.classList.add('splash-hidden');
        setTimeout(() => splash.remove(), 750);
      }
    };

    // Safety fallback: hide after 5s if JS fails
    window.addEventListener('load', () => {
      setTimeout(window.hideSplashScreen, 5000);
    });

    // ── Lottie loader ──
    // Ne lance les Lottie que si la lib est disponible (CDN chargé)
    function initLottieSplash() {
      if (typeof lottie === 'undefined') return;

      var icons = [
        { id: 'lottie-mobile', cell: 'sc-mobile', path: '/assets/lottie/mobile.json' },
        { id: 'lottie-computer', cell: 'sc-computer', path: '/assets/lottie/computer.json' },
        { id: 'lottie-apple', cell: 'sc-apple', path: '/assets/lottie/apple.json' },
        { id: 'lottie-gaming', cell: 'sc-gaming', path: '/assets/lottie/gaming.json' },
      ];

      icons.forEach(function (item, i) {
        // Délai staggeré : 0ms, 130ms, 260ms, 390ms
        setTimeout(function () {
          lottie.loadAnimation({
            container: document.getElementById(item.id),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: item.path,
          });
          // Reveal de la cellule avec un léger décalage après le chargement
          var cell = document.getElementById(item.cell);
          if (cell) {
            setTimeout(function () { cell.classList.add('shown'); }, 60);
          }
        }, i * 130);
      });
    }

    // Attendre que lottie-web soit prêt (CDN async)
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initLottieSplash);
    } else {
      initLottieSplash();
    }

    // Masquer le splash immédiatement si l'utilisateur revient en arrière-plan
    // (tab focus ou app foreground après backgrounding en PWA)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        window.hideSplashScreen();
      }
    });
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) {
        // Page restaurée depuis le bfcache (back/forward cache)
        window.hideSplashScreen();
      }
    });
  </script>
  <script>
    // Ne plus désenregistrer le SW : en PWA le SW doit servir index.html pour toutes les routes
    // (évite 404 au rafraîchissement sur /deals, /simulateur, etc.)
  </script>
