<head>
  <meta charset="UTF-8" />

  <meta property="og:title" content="TΞKΗ+ — L'échange intelligent d'appareils électroniques" />

    content="Échangez votre smartphone en toute simplicité : estimation rapide et transaction sécurisée." />

  <link rel="apple-touch-icon" href="/src/assets/logos/robott.jpeg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    /* ─────────────────────────────────────────
       SPLASH SCREEN — Pure Black Premium
    ───────────────────────────────────────── */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      z-index: 9999;
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), filter 0.7s ease;
      overflow: hidden;
    }

    /* Ambient green glow blob */
    #splash-screen::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 480px;
      height: 480px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(0, 255, 65, 0.12) 0%, transparent 70%);
      animation: splashGlowPulse 3s ease-in-out infinite;
      pointer-events: none;
    }

    /* Subtle grid texture */
    #splash-screen::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 52px 52px;
      pointer-events: none;
    }

    /* ── Logo wrapper ── */
    .splash-logo-wrap {
      position: relative;
      z-index: 1;
      margin-bottom: 2.5rem;
      animation: splashLogoIn 0.7s cubic-bezier(0.34, 1.2, 0.64, 1) 0.1s both;
    }

    /* Outer glow ring */
    .splash-ring {
      position: absolute;
      inset: -14px;
      border-radius: 999px;
      border: 1.5px solid rgba(0, 255, 65, 0.25);
      animation: splashRingPulse 2.4s ease-in-out 0.6s infinite;
    }

    /* Second ring */
    .splash-ring-2 {
      position: absolute;
      inset: -28px;
      border-radius: 999px;
      border: 1px solid rgba(0, 255, 65, 0.10);
      animation: splashRingPulse 2.4s ease-in-out 1s infinite;
    }

    .splash-logo {
      width: 96px;
      height: 96px;
      border-radius: 26px;
      display: block;
      position: relative;
      z-index: 1;
      box-shadow:
        0 0 0 1px rgba(0, 255, 65, 0.18),
        0 0 40px rgba(0, 255, 65, 0.10),
        0 20px 60px rgba(0, 0, 0, 0.6);
    }

    /* ── Brand name ── */
    .splash-brand {
      position: relative;
      z-index: 1;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 1rem;
      animation: splashBrandIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both;
    }

    .splash-brand .brand-plus {
      color: #00FF41;
      text-shadow: 0 0 20px rgba(0, 255, 65, 0.6);
    }

    /* ── Slogan — line by line reveal ── */
    .splash-slogan {
      position: relative;
      z-index: 1;
      text-align: center;
      overflow: hidden;
    }

    .splash-slogan-line {
      display: block;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1.7;
      opacity: 0;
      transform: translateY(10px);
    }

    .splash-slogan-line.line-1 {
      animation: splashLineIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.85s forwards;
    }

    .splash-slogan-line.line-2 {
      animation: splashLineIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.05s forwards;
    }

    .splash-slogan-line .hl {
      color: #00FF41;
      font-weight: 800;
    }

    /* ── Progress bar ── */
    .splash-bar-wrap {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      z-index: 1;
      animation: splashBarAppear 0.3s ease 0.7s both;
    }

    .splash-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #064e3b, #00FF41);
      border-radius: 2px;
      animation: splashBarFill 1.5s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards;
    }

    /* ── Animations ── */
    @keyframes splashGlowPulse {
      0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.1); }
    }

    @keyframes splashLogoIn {
      from { opacity: 0; transform: scale(0.75) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes splashRingPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.3; transform: scale(1.06); }
    }

    @keyframes splashBrandIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes splashLineIn {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes splashBarAppear {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes splashBarFill {
      from { width: 0%; }
      to   { width: 100%; }
    }

    /* ── Exit transition ── */
    .splash-hidden {
      opacity: 0;
      filter: blur(12px);
      pointer-events: none;
    }
  </style>
</head>

<body class="bg-background">
  <div id="splash-screen">
    <div class="splash-logo-wrap">
      <div class="splash-ring"></div>
      <div class="splash-ring-2"></div>
      <img src="/icon.jpeg" alt="TEKH+" class="splash-logo">
    </div>

    <div class="splash-brand">
      TΞKΗ<span class="brand-plus">+</span>
    </div>

    <div class="splash-slogan">
      <span class="splash-slogan-line line-1">pour une <span class="hl">inclusion numérique</span></span>
      <span class="splash-slogan-line line-2">de qualité <span class="hl">pour tous</span></span>
    </div>

    <div class="splash-bar-wrap">
      <div class="splash-bar"></div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    window.hideSplashScreen = () => {
      const splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('splash-hidden')) {
        splash.classList.add('splash-hidden');
        setTimeout(() => splash.remove(), 750);
      }
    };

    // Safety fallback: hide after 3.5s if JS fails
    window.addEventListener('load', () => {
      setTimeout(window.hideSplashScreen, 3500);
    });
  </script>
  <script>
    // Ne plus désenregistrer le SW : en PWA le SW doit servir index.html pour toutes les routes
    // (évite 404 au rafraîchissement sur /deals, /simulateur, etc.)
  </script>
</body>

</html>
