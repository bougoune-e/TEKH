services:
  - type: web
    name: tekh
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    # Headers de cache :
    # - index.html : jamais caché → le navigateur récupère toujours la dernière version
    # - assets/* : cachés 1 an (immutable car les noms incluent un hash de contenu Vite)
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw-fallback.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
